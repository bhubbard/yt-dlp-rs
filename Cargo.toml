[package]
name = "yt-dlp-rs"
version = "0.1.0"
edition = "2021"
authors = ["Brandon Hubbard <brandon@brandonhubbard.com>"]
description = "Blazingly fast, modular, memory-safe media downloader in pure Rust inspired by yt-dlp"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bhubbard/yt-dlp-rs"
homepage = "http://code.brandonhubbard.com/yt-dlp-rs/"

[[bin]]
name = "yt-dlp"
path = "src/bin/main.rs"

[lib]
name = "yt_dlp_rs"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "cookies", "gzip", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
indicatif = { version = "0.17", features = ["tokio"] }
regex = "1.10"
url = "2.5"
thiserror = "1.0"
anyhow = "1.0"
futures = "0.3"
async-trait = "0.1"
bytes = "1.7"
chrono = "0.4"

[dev-dependencies]
tempfile = "3.12"
tokio-test = "0.4"
